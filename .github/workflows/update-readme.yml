name: Update README Timestamp

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-main
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update timestamp only when manually requested
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          TIMESTAMP_LINE="Last updated: $DATE"

          if grep -q "Last updated:" README.md; then
            sed -i "s/Last updated:.*/$TIMESTAMP_LINE/" README.md
          else
            printf "\n%s\n" "$TIMESTAMP_LINE" >> README.md
          fi

      - name: Commit timestamp update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README timestamp is already current."
            exit 0
          fi
          git commit -m "chore: update README timestamp"
          git push origin HEAD:main
