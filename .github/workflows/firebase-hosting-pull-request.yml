name: Firebase Hosting Preview (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-preview-manual
  cancel-in-progress: true

jobs:
  build_and_preview:
    name: Build and publish protected preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leetcode
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: leetcode/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint and build
        run: |
          npm run lint
          npm run build

      - name: Deploy preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEETCODE_TRACKER_6F022 }}
          projectId: leetcode-tracker-6f022
          channelId: manual-preview
          expires: 7d
          entryPoint: ./leetcode
