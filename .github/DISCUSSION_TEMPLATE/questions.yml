title: "❓ Question: "
body:
  - type: markdown
    attributes:
      value: |
        Search the README and docs/ first. Never share passwords, tokens, service-account files, or real user records.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What have you tried?
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmation
      options:
        - label: I have removed credentials and personal data.
          required: true
