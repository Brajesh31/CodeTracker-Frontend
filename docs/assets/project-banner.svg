<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">CodeTracker project banner</title>
  <desc id="desc">A blue-indigo gradient banner with a checklist illustration and the CodeTracker title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3fa8"/>
      <stop offset=".55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1e58" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1400" height="420" rx="32" fill="url(#bg)"/>
  <circle cx="1210" cy="40" r="180" fill="#fff" opacity=".06"/>
  <circle cx="1320" cy="360" r="230" fill="#fff" opacity=".05"/>
  <circle cx="850" cy="390" r="220" fill="#93c5fd" opacity=".09"/>
  <g transform="translate(105 92)">
    <rect x="0" y="0" width="160" height="160" rx="42" fill="#fff" opacity=".12" stroke="#fff" stroke-opacity=".3"/>
    <rect x="38" y="24" width="88" height="112" rx="12" fill="url(#card)" filter="url(#shadow)"/>
    <path d="m52 53 7 7 12-14m-19 39 7 7 12-14m-19 39 7 7 12-14" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M82 53h29M82 91h29M82 129h29" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="330" y="180" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="-2">CodeTracker</text>
  <text x="335" y="238" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="500">Your coding-practice history, in one place.</text>
  <text x="335" y="290" fill="#eff6ff" opacity=".82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">React • Vite • Firebase Authentication • Cloud Firestore</text>
  <g transform="translate(1080 132)" opacity=".9">
    <rect x="0" y="0" width="190" height="150" rx="20" fill="#fff" opacity=".12" stroke="#fff" stroke-opacity=".35"/>
    <path d="M28 42h134M28 74h93M28 106h113" stroke="#dbeafe" stroke-width="10" stroke-linecap="round"/>
    <circle cx="150" cy="74" r="12" fill="#bfdbfe"/>
    <circle cx="142" cy="106" r="12" fill="#c7d2fe"/>
  </g>
</svg>