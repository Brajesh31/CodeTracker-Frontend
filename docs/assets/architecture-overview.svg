<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">CodeTracker architecture overview</title>
  <desc id="desc">Diagram showing browser React application, Firebase Authentication, Cloud Firestore, and Firebase Hosting with security rules as the access boundary.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6Z" fill="#64748b"/></marker>
    <style>
      .h{font:700 28px Inter,Arial,sans-serif;fill:#0f172a}.t{font:600 20px Inter,Arial,sans-serif;fill:#0f172a}.s{font:16px Inter,Arial,sans-serif;fill:#334155}.w{font:700 21px Inter,Arial,sans-serif;fill:#fff}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" rx="26" fill="#f8fafc"/>
  <text x="55" y="62" class="h">CodeTracker • System architecture</text>
  <rect x="45" y="105" width="510" height="460" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="75" y="145" class="t">Untrusted browser client</text>
  <rect x="90" y="180" width="420" height="105" rx="16" fill="url(#blue)"/>
  <text x="300" y="220" class="w" text-anchor="middle">React + React Router</text>
  <text x="300" y="252" fill="#dbeafe" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">Landing • Auth forms • Dashboard • Question list</text>
  <rect x="90" y="330" width="190" height="90" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="185" y="368" class="t" text-anchor="middle">Firebase Auth</text>
  <text x="185" y="393" class="s" text-anchor="middle">Client SDK</text>
  <rect x="320" y="330" width="190" height="90" rx="14" fill="#fff" stroke="#60a5fa" stroke-width="2"/>
  <text x="415" y="368" class="t" text-anchor="middle">Firestore</text>
  <text x="415" y="393" class="s" text-anchor="middle">Client SDK</text>
  <rect x="90" y="465" width="420" height="62" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="300" y="503" class="t" text-anchor="middle">VITE_FIREBASE_* public client config</text>
  <path d="M300 285v25H185v20M300 310h115v20" class="line"/>
  <path d="M300 420v45" class="line"/>
  <rect x="665" y="105" width="490" height="460" rx="24" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="695" y="145" class="t">Firebase project</text>
  <rect x="730" y="185" width="360" height="82" rx="14" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <text x="910" y="220" class="t" text-anchor="middle">Firebase Authentication</text>
  <text x="910" y="246" class="s" text-anchor="middle">Identity and session</text>
  <rect x="730" y="315" width="360" height="82" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="910" y="350" class="t" text-anchor="middle">Firestore Security Rules</text>
  <text x="910" y="376" class="s" text-anchor="middle">Authoritative access boundary</text>
  <rect x="730" y="445" width="360" height="82" rx="14" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <text x="910" y="480" class="t" text-anchor="middle">Cloud Firestore</text>
  <text x="910" y="506" class="s" text-anchor="middle">questions collection</text>
  <path d="M280 375h410" class="line"/>
  <path d="M510 375h170" class="line"/>
  <path d="M910 267v48" class="line"/>
  <path d="M910 397v48" class="line"/>
  <text x="610" y="355" class="s" text-anchor="middle">Authenticated requests</text>
  <text x="600" y="615" class="s" text-anchor="middle">Frontend filtering does not replace Firebase Security Rules. Rules are externally configured, not tracked in this repo today.</text>
</svg>